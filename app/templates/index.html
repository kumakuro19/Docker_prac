<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Python 変換ツール (MVP)</h1>
      <p>
        フォルダ依存のあるアプリは <code>.zip</code> または <code>.7z</code> を選択してください。<br />
        単体ファイルは <code>.py</code> 選択か GitHub の <code>.py</code> URL でも変換できます。
      </p>

      <form id="convertForm">
        <label for="projectZip">プロジェクトアーカイブ（.zip / .7z 推奨）</label>
        <input id="projectZip" name="project_zip" type="file" accept=".zip,.7z" />

        <label for="mainScript">起動対象 main_script（任意）</label>
        <input
          id="mainScript"
          name="main_script"
          type="text"
          placeholder="例: src/main.py"
        />

        <div class="or">または</div>

        <label for="pyFile">Pythonファイル (.py)</label>
        <input id="pyFile" name="py_file" type="file" accept=".py" />

        <label for="githubUrl">GitHub .py URL</label>
        <input
          id="githubUrl"
          name="github_url"
          type="url"
          placeholder="https://github.com/<user>/<repo>/blob/<branch>/path/to/file.py"
        />

        <p class="hint">優先順位: project_zip > py_file > github_url</p>
        <button id="convertBtn" type="submit">変換開始</button>
      </form>

      <p id="result" class="result">ここに結果が表示されます。</p>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
